<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>{{ char_name }} — DREAM</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #000; font-family: 'Share Tech Mono', monospace;
    }
    #stage { position: fixed; inset: 0; background: #000; }
    #stage video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .35s ease;
    }
    #stage video.showing { opacity: 1; }

    #dream-status {
      position: fixed; top: env(safe-area-inset-top, 12px); left: 12px;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; letter-spacing: .08em; color: #9ff;
      text-shadow: 0 0 6px rgba(0,0,0,.8);
      z-index: 5;
    }
    #dream-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #555; box-shadow: 0 0 6px #555;
    }
    #dream-dot.on   { background: #4f8; box-shadow: 0 0 8px #4f8; }
    #dream-dot.warn { background: #fa4; box-shadow: 0 0 8px #fa4; }

    #caption {
      position: fixed; left: 0; right: 0; bottom: 110px;
      text-align: center; padding: 0 20px;
      font-size: 15px; color: #eaf6ff;
      text-shadow: 0 0 10px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9);
      z-index: 5; pointer-events: none;
      max-height: 30vh; overflow: hidden;
    }

    #controls {
      position: fixed; left: 0; right: 0;
      bottom: env(safe-area-inset-bottom, 24px);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      z-index: 5;
    }
    #mic-btn {
      width: 76px; height: 76px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.5);
      background: rgba(0,0,0,.45);
      color: #fff; font-size: 30px;
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #mic-btn.active {
      border-color: #f55; background: rgba(255,0,0,.35);
      box-shadow: 0 0 24px rgba(255,60,60,.6);
    }
    #mic-hint {
      font-size: 11px; color: #bbb; letter-spacing: .05em;
      text-shadow: 0 0 6px rgba(0,0,0,.9);
    }
    #text-fallback {
      display: none; position: fixed; left: 12px; right: 12px;
      bottom: calc(env(safe-area-inset-bottom, 24px) + 96px);
      gap: 8px; z-index: 5;
    }
    #text-fallback.show { display: flex; }
    #text-fallback input {
      flex: 1; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.3);
      color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 14px;
    }
    #text-fallback button {
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.3);
      color: #fff; padding: 0 16px; border-radius: 8px;
    }
    #kb-toggle {
      position: fixed; top: env(safe-area-inset-top, 12px); right: 12px;
      z-index: 5; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.3);
      color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 16px;
    }
  </style>
</head>
<body>

  <div id="stage"></div>

  <div id="dream-status">
    <span id="dream-dot"></span><span id="dream-state">CONNECTING</span>
  </div>

  <button id="kb-toggle" title="Type instead">⌨</button>

  <div id="caption"></div>

  <div id="text-fallback">
    <input id="text-input" type="text" placeholder="Type a message…" autocomplete="off"/>
    <button id="send-btn">SEND</button>
  </div>

  <div id="controls">
    <button id="mic-btn" title="Tap to talk">🎙</button>
    <div id="mic-hint">TAP TO TALK</div>
  </div>

  <script src="/static/js/dream.js" data-char="{{ char_name | upper }}"></script>
</body>
</html>
